# nginx proxy address - http://172.17.0.1:64191

name: grocy
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: lscr.io/linuxserver/grocy:latest
    container_name: grocy-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: grocy-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      PUID: ${SERVICE_USER:-1000}
      PGID: ${SERVICE_GROUP:-1000}
      GROCY_CURRENCY: ${GROCY_CURRENCY:-USD}
      GROCY_CULTURE: ${GROCY_CULTURE:-en}
    healthcheck:
      test: ['CMD', 'curl', '-s', '-o', '/dev/null', '--max-time', '5', 'http://127.0.0.1:80/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - '172.17.0.1:64191:80'
    volumes:
      - './volumes/config/grocy:/config:z'
    networks:
      - grocy

networks:
  grocy:
    name: grocy
    external: false
